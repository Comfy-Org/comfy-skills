name: CI - Cursor Review

# Thin caller for the shared reusable cursor-review workflow in
# Comfy-Org/github-workflows — the review logic (panel matrix, judge
# consolidation, prompts, extract/post/notify scripts) lives there as the
# single source of truth. This repo carries only its own generated paths.
#
# Triggered by adding the `cursor-review` label to a PR. Needs CURSOR_API_KEY
# to post a review; without it the run degrades to a job summary. The panel is
# secret-gated, so it does not run on fork PRs, and GitHub does not run
# `pull_request` workflows for a PR with merge conflicts — in both cases
# applying the label produces nothing but a job log line.
#
# `labeled` is not retroactive: a PR already carrying the label when this file
# lands gets no event, and needs the label removed and re-applied.

on:
  pull_request:
    types: [labeled, unlabeled]

# Scoped to the label, not just the PR. The reusable's documented caller
# pattern keys on the PR number alone, but that pattern subscribes to widened
# events where `github.event.label.name` is empty; this caller is label-only,
# so the name is always present, and a PR-number-only group would let any
# unrelated label add cancel an in-flight review. The replacement run then
# no-ops at the reusable's gate and the requested review is lost silently —
# which is the exact failure this file exists to stop. Raised by the panel and
# by CodeRabbit on the PR that added this file.
concurrency:
  group: cursor-review-pr-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  cursor-review:
    # Only this label starts a review, so an unrelated label change does not
    # spin up a run at all.
    if: github.event.action == 'labeled' && github.event.label.name == 'cursor-review'
    # Scope the GITHUB_TOKEN to this job; the reusable restricts further per
    # job — only its post-review job holds pull-requests: write, and it checks
    # out no PR code.
    permissions:
      contents: read
      pull-requests: write
    # SHA-pinned. Bump this SHA to pick up upstream changes and keep
    # workflows_ref identical, or the workflow is pinned while its scripts are
    # not — the reusable checks the two against each other at run time.
    uses: Comfy-Org/github-workflows/.github/workflows/cursor-review.yml@49c752aed37349ef89d1d5e8c85b367733141e86 # github-workflows main (49c752a)
    with:
      workflows_ref: 49c752aed37349ef89d1d5e8c85b367733141e86
      # Generated and vendored paths, fed to the shared classifier so they are
      # out of both the size gate and the reviewed diff. Setting this REPLACES
      # the reusable's default list, so the defaults are restated verbatim
      # first; lockfiles are classifier built-ins and need no entry. Plain
      # globs here, not git pathspecs. `diff_excludes` is deliberately NOT
      # used: its paths still count toward the size cap, so churn under an
      # excluded hand-authored path can skip the whole review.
      extra_generated_globs: >-
        **/node_modules/**
        **/dist/**
        **/vendor/**
        **/*.generated.*
        **/*.min.js
        **/*.min.css
    secrets:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      # Optional — enables start/complete Slack DMs to the triggerer.
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
