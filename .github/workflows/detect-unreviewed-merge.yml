# Detects merges to main that landed without an approving review and opens a
# tracking issue in Comfy-Org/unreviewed-merges (SOC 2). Detection logic lives
# in the reusable workflow; this caller just wires it up.
name: Detect Unreviewed Merge

on:
  push:
    branches: [main]

concurrency:
  group: detect-unreviewed-merge-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    uses: Comfy-Org/github-workflows/.github/workflows/detect-unreviewed-merge.yml@b5119d22721c006b1ea14ff5e823a83c96bba4a7 # v1
    with:
      approval-mode: latest-per-reviewer
    secrets:
      UNREVIEWED_MERGES_TOKEN: ${{ secrets.UNREVIEWED_MERGES_TOKEN }}
